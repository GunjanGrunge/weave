name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-deploy-main
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      FIREBASE_PROJECT_ID: backupapp-bbf71
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || -z "$before" || "$before" =~ ^0+$ ]]; then
            echo "deploy_functions=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" "${{ github.sha }}" -- functions firebase.json; then
            echo "deploy_functions=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_functions=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run frontend tests
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Verify functions
        working-directory: functions
        run: npm run verify

      - name: Configure Firebase service account
        shell: bash
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "Missing required GitHub secret: FIREBASE_SERVICE_ACCOUNT_JSON" >&2
            exit 1
          fi
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Seed Gemini model registry
        working-directory: functions
        run: node scripts/seedModelRegistry.mjs

      - name: Prepare verified Firebase config
        run: jq 'del(.functions[].predeploy)' firebase.json > firebase.ci.json

      - name: Deploy Firestore
        run: >
          npx firebase-tools deploy
          --config firebase.ci.json
          --project "$FIREBASE_PROJECT_ID"
          --only firestore
          --non-interactive

      - name: Deploy Functions sequentially
        if: steps.changes.outputs.deploy_functions == 'true'
        shell: bash
        run: |
          functions=(
            health
            whoami
            listBooks
            createBook
            createChapter
            retryOpeningSuggestion
            getVision
            updateVision
            getMessages
            generateScene
            saveGeneratedScene
            regenerateScene
            revertGeneratedScene
            acceptScene
            getStyleConfig
            updateBookStyle
            saveSnapshot
            listSnapshots
            compareSnapshot
            restoreSnapshot
            exportBook
            getManuscript
            enhanceManuscriptChapter
            deleteBook
            extractEntitiesOnSceneAccept
            summarizePreviousChapter
            generateMuseNoteOnSceneAccept
          )

          for function_name in "${functions[@]}"; do
            deployed=false
            for attempt in 1 2 3; do
              if npx firebase-tools deploy \
                --config firebase.ci.json \
                --project "$FIREBASE_PROJECT_ID" \
                --only "functions:$function_name" \
                --non-interactive \
                --force; then
                deployed=true
                break
              fi
              if [[ "$attempt" -lt 3 ]]; then
                sleep 30
              fi
            done
            if [[ "$deployed" != "true" ]]; then
              echo "Failed to deploy function after 3 attempts: $function_name" >&2
              exit 1
            fi
          done

      - name: Deploy Hosting
        run: >
          npx firebase-tools deploy
          --config firebase.ci.json
          --project "$FIREBASE_PROJECT_ID"
          --only hosting
          --non-interactive
